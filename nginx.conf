c
#user  nobody;
user root;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
         listen       [::]:80;
        server_name  172.31.100.1;




         location / {
            root   /opt/hdjd_datav;
            index  index.html index.htm;
        }



        location /api/ {
          if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
            add_header 'Access-Control-Max-Age' 17280000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
          }
          expires 1d;
          client_max_body_size    200M;
          proxy_connect_timeout   120000;
          proxy_send_timeout      120000;
          proxy_read_timeout      120000;
          rewrite ^/api/(.*)$ /$1 break;
          proxy_pass              http://172.31.100.2:8080;
          proxy_set_header        Referer     "http://172.31.100.2:8080/";
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $host;
          proxy_set_header X_Forward_For $proxy_add_x_forwarded_for;
        }

        location /screen {
          if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
            add_header 'Access-Control-Max-Age' 17280000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
          }
          expires 1d;
          client_max_body_size    200M;
          proxy_connect_timeout   120000;
          proxy_send_timeout      120000;
          proxy_read_timeout      120000;
          proxy_pass              http://172.31.100.2:8080/screen;
          proxy_set_header        Referer     "http://172.31.100.2:8080";
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $host;
          proxy_set_header X_Forward_For $proxy_add_x_forwarded_for;
        }


        location /ngc_monitor {
          if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
            add_header 'Access-Control-Max-Age' 17280000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
          }
          expires 1d;
          client_max_body_size    200M;
          proxy_connect_timeout   120000;
          proxy_send_timeout      120000;
          proxy_read_timeout      120000;
          proxy_pass              http://172.31.100.2:8080//ngc_monitor ;
          proxy_set_header        Referer     "http://172.31.100.2:8080";
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $host;
          proxy_set_header X_Forward_For $proxy_add_x_forwarded_for;
        }

        location /static {
          client_max_body_size    200M;
          proxy_connect_timeout   120000s;
          proxy_send_timeout      120000s;
          proxy_read_timeout      120000s;
          proxy_pass              http://172.31.100.2:8080/static;

        }
        location /hdjd/read_excle_screen {
        		client_max_body_size    200M;
          	proxy_connect_timeout   120000s;
          	proxy_send_timeout      120000s;
          	proxy_read_timeout      120000s;
             	proxy_pass      http://172.31.100.2:8080/hdjd/read_excle_screen;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}


    # HTTPS server
    #
    server {
        listen       445 ssl;
        server_name  172.31.100.1;

        ssl_certificate      ./cert/cert.pem;
        ssl_certificate_key  ./cert/cert.key;

    #    ssl_session_cache    shared:SSL:1m;
    #    ssl_session_timeout  5m;

    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;
    }

}
